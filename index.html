<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Keuangan Pribadi</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Glassmorphism Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="container">
        <!-- Notification Area -->
        <div id="notification" class="notification hidden"></div>

        <!-- AUTHENTICATION VIEW -->
        <div id="auth-view" class="view glass-panel">
            <h1 class="gradient-text"><i class="fas fa-wallet"></i> KeuanganKu</h1>
            <p class="subtitle">Pantau pengeluaran & pemasukan Anda.</p>
            
            <form id="auth-form">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                
                <button type="submit" id="btn-login" class="btn btn-primary">Masuk</button>
                <button type="button" id="btn-register" class="btn btn-secondary mt-2">Daftar Akun Baru</button>
                
                <div class="divider"><span>ATAU</span></div>
                
                <button type="button" id="btn-google" class="btn btn-google full-width mt-2">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="18" height="18"> 
                    Masuk dengan Google
                </button>
            </form>
        </div>

        <!-- DASHBOARD VIEW (Hidden by default) -->
        <div id="dashboard-view" class="view hidden">
            <!-- Header -->
            <header class="dashboard-header glass-panel">
                <div class="header-left">
                    <h2 class="gradient-text"><i class="fas fa-chart-pie"></i> Laporan</h2>
                    <span id="user-email" class="user-email">user@domain.com</span>
                </div>
                <button id="btn-logout" class="btn btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> Keluar</button>
            </header>

            <div class="dashboard-content">
                <!-- Add Entry Form -->
                <section class="add-entry-section glass-panel">
                    <h3>Tambah Transaksi Baru</h3>
                    <form id="entry-form">
                        <div class="form-row">
                            <div class="input-group type-selector">
                                <label>
                                    <input type="radio" name="entry_type" value="pemasukan" checked>
                                    <span class="type-btn success"><i class="fas fa-arrow-down"></i> Pemasukan</span>
                                </label>
                                <label>
                                    <input type="radio" name="entry_type" value="pengeluaran">
                                    <span class="type-btn danger"><i class="fas fa-arrow-up"></i> Pengeluaran</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-row two-col">
                            <div class="input-group column">
                                <label for="amount">Jumlah (Rp)</label>
                                <input type="number" id="amount" placeholder="Contoh: 50000" required min="1">
                            </div>
                            <div class="input-group column">
                                <label for="date">Tanggal</label>
                                <input type="date" id="date" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="description">Keterangan / Deskripsi</label>
                            <input type="text" id="description" placeholder="Contoh: Makan Siang / Gaji Bulan Ini" required>
                        </div>

                        <!-- Image Upload Area -->
                        <div class="input-group image-upload-group">
                            <label>Foto Invoice / Bon (Opsional)</label>
                            <label for="invoice-image" class="file-upload-label">
                                <i class="fas fa-cloud-upload-alt fa-2x"></i>
                                <span>Pilih atau Tarik Foto Kesini</span>
                                <input type="file" id="invoice-image" accept="image/png, image/jpeg, image/jpg">
                            </label>
                            <div id="image-preview" class="image-preview hidden">
                                <img id="preview-img" src="" alt="Preview">
                                <button type="button" id="btn-remove-image" class="btn-remove"><i class="fas fa-times"></i></button>
                            </div>
                        </div>

                        <button type="submit" id="btn-save-entry" class="btn btn-primary full-width">
                            Simpan Transaksi
                        </button>
                    </form>
                </section>

                <!-- Financial History -->
                <section class="history-section glass-panel">
                    <div class="history-header">
                        <h3>Riwayat Transaksi</h3>
                        
                        <!-- Simple Summary -->
                        <div class="summary-cards">
                            <div class="summary-card income">
                                <span>Pemasukan</span>
                                <h4 id="tot-income">Rp 0</h4>
                            </div>
                            <div class="summary-card expense">
                                <span>Pengeluaran</span>
                                <h4 id="tot-expense">Rp 0</h4>
                            </div>
                            <div class="summary-card balance">
                                <span>Saldo Akhir</span>
                                <h4 id="tot-balance">Rp 0</h4>
                            </div>
                        </div>
                    </div>

                    <div class="entry-list-container">
                        <ul id="entry-list" class="entry-list">
                            <!-- Items injected via JS -->
                            <li class="empty-state">Belum ada transaksi.</li>
                        </ul>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Firebase App (Modular) -->
    <script type="module" src="app.js"></script>
</body>
</html>
